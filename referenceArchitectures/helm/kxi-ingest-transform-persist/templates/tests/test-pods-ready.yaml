apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "kxi-ingest-transform-persist.fullname" . }}-test-pods-ready"
  labels:
    {{- include "kxi-ingest-transform-persist.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ include "kxi-ingest-transform-persist.fullname" . }}-test
  restartPolicy: Never
  containers:
  - name: test-pods-ready
    image: bitnami/kubectl:latest
    command:
    - /bin/bash
    - -c
    - |
      set -e
      echo "Checking if all pods are ready..."

      RELEASE_NAME="{{ .Release.Name }}"
      NAMESPACE="{{ .Release.Namespace }}"
      WAIT_TIMEOUT=300s

      # Check kxi-gw pods
      echo "Checking kxi-gw pods..."
      kubectl wait --for=condition=Ready pod -n ${NAMESPACE} -l app=${RELEASE_NAME}-kxi-gw-sg --timeout=${WAIT_TIMEOUT} 2>/dev/null || {
        echo "ERROR: Service Gateway pods are not ready"
        kubectl get pods -n ${NAMESPACE} -l app=${RELEASE_NAME}-kxi-gw-sg
        exit 1
      }
      echo "SUCCESS: Service Gateway pods are ready"

      # Check kxi-db DA (Data Access) pods
      echo "Checking kxi-db DA pods for release ${RELEASE_NAME}..."
      kubectl wait --for=condition=Ready pod -n ${NAMESPACE} -l app=${RELEASE_NAME}-kxi-db-da --timeout=${WAIT_TIMEOUT} 2>/dev/null || {
        echo "ERROR: Database DA pods are not ready for release ${RELEASE_NAME}"
        kubectl get pods -n ${NAMESPACE} -l app=${RELEASE_NAME}-da
        exit 1
      }
      echo "SUCCESS: Database DA pods are ready"

      # Check kxi-db SM (Storage Manager) pods
      echo "Checking kxi-db SM pods for release ${RELEASE_NAME}..."
      kubectl wait --for=condition=Ready pod -n ${NAMESPACE} -l app=${RELEASE_NAME}-kxi-db-sm --timeout=${WAIT_TIMEOUT} 2>/dev/null || {
        echo "ERROR: Database SM pods are not ready for release ${RELEASE_NAME}"
        kubectl get pods -n ${NAMESPACE} -l app=${RELEASE_NAME}-sm
        exit 1
      }
      echo "SUCCESS: Database SM pods are ready"

      # Check kxi-rt pods
      echo "Checking kxi-rt pods for release ${RELEASE_NAME}..."
      kubectl wait --for=condition=Ready pod -n ${NAMESPACE} -l app.kubernetes.io/name=kxi-rt,app.kubernetes.io/instance=${RELEASE_NAME} --timeout=${WAIT_TIMEOUT} 2>/dev/null || {
        echo "ERROR: RT pods are not ready for release ${RELEASE_NAME}"
        kubectl get pods -n ${NAMESPACE} -l app.kubernetes.io/name=kxi-rt,app.kubernetes.io/instance=${RELEASE_NAME}
        exit 1
      }
      echo "SUCCESS: RT pods are ready"

      # Check kxi-sp pods
      echo "Checking kxi-sp pods..."
      kubectl wait --for=condition=Ready pod -n ${NAMESPACE} -l app.kubernetes.io/name=kxi-sp,app.kubernetes.io/instance=${RELEASE_NAME} --timeout=${WAIT_TIMEOUT} 2>/dev/null || {
        echo "ERROR: Stream Processor pods are not ready"
        kubectl get pods -n ${NAMESPACE} -l app.kubernetes.io/name=kxi-sp,app.kubernetes.io/instance=${RELEASE_NAME}
        exit 1
      }
      echo "SUCCESS: Stream Processor pods are ready"

      echo "All pods are ready for release ${RELEASE_NAME}!"
